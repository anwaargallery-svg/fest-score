<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fest Scoreboard - Live Stage Display</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/image.png">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="assets/style.css" rel="stylesheet">

    <style>
        /* Event Programme Results - Horizontal Track Styles */
        .fest-horizontal-track {
            display: flex !important;
            flex-wrap: nowrap !important;
            overflow-x: auto !important;
            scroll-behavior: auto;
            -webkit-overflow-scrolling: touch;
            gap: 1.25rem;
            padding: 0.5rem 0.25rem 1.25rem 0.25rem;
            scrollbar-width: thin;
            scrollbar-color: #ffc107 rgba(0, 0, 0, 0.1);
            cursor: grab;
        }
        .fest-horizontal-track:active {
            cursor: grabbing;
        }
        .fest-horizontal-track::-webkit-scrollbar {
            height: 6px;
        }
        .fest-horizontal-track::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.08);
            border-radius: 10px;
        }
        .fest-horizontal-track::-webkit-scrollbar-thumb {
            background: #ffc107;
            border-radius: 10px;
        }
        .fest-horizontal-track > div,
        .fest-horizontal-track > .fest-card-item {
            flex: 0 0 auto !important;
            width: 350px !important;
            max-width: 85vw !important;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header-badge {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10b981;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 1rem;
        }

        .team-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .team-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5) !important;
        }

        .custom-table {
            color: #ffffff;
        }

        .custom-table thead th {
            background-color: #0f172a !important;
            color: #38bdf8 !important;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1) !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            padding: 1rem;
        }

        .custom-table tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease;
        }

        .custom-table tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.05) !important;
        }

        /* Pulse glow animation for Live badge */
        .live-pulse {
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse-ring 1.5s infinite cubic-bezier(0.66, 0, 0, 1);
        }

        @keyframes pulse-ring {
            to {
                box-shadow: 0 0 0 12px rgba(239, 68, 68, 0);
            }
        }
    </style>
</head>
<body class="p-3 p-md-5">

    <!-- Top Fullscreen Header Controls (NO NAVBARS) -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary border-opacity-25">
        <div class="d-flex align-items-center gap-3">
            <img src="assets/images/image.png" alt="Logo" class="bg-white rounded-circle p-1" style="width: 50px; height: 50px; object-fit: contain;">
            <div>
                <h3 class="fw-bold mb-0 text-white text-uppercase" id="festTitleHeader">ATSA Arts Fest Scoreboard</h3>
                <small class="text-white-50">Anwariyya Arabic College Live Stage Display</small>
            </div>
        </div>

        <div class="d-flex align-items-center gap-3 mt-3 mt-md-0">
            <div class="d-inline-flex align-items-center gap-2 px-3 py-2 rounded-pill fw-bold text-uppercase small header-badge shadow-sm">
                <span class="live-pulse" id="liveDot"></span>
                <span id="festStatusBadge"><i class="bi bi-trophy-fill me-1 text-warning"></i> LIVE STAGE SCOREBOARD</span>
            </div>

            <button type="button" class="btn btn-outline-light btn-sm rounded-pill px-3 fw-bold" id="browserFullscreenBtn">
                <i class="bi bi-arrows-fullscreen me-1"></i> Full Screen
            </button>
            <a href="index.html" class="btn btn-sm btn-secondary rounded-pill px-3">
                <i class="bi bi-house-door me-1"></i> Home
            </a>
        </div>
    </div>

    <div class="container-fluid px-0">
        
        <!-- Live Team Standings Grid -->
        <div class="row g-3 justify-content-center mb-5" id="scoreboardTeamsContainer">
            <div class="col-12 text-center text-white-50 py-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-2">Loading Live Team Standings...</p>
            </div>
        </div>

        <!-- Published Results Card & Grid Views -->
        <div class="card glass-card border-0 overflow-hidden shadow-lg mb-4">
            <div class="card-header bg-dark bg-opacity-50 p-3 d-flex flex-wrap align-items-center justify-content-between gap-2 border-bottom border-secondary border-opacity-25">
                <div class="d-flex align-items-center gap-2">
                    <h5 class="mb-0 fw-bold text-white"><i class="bi bi-award-fill text-warning me-2"></i>Event Programme Results</h5>
                    <span class="badge bg-warning text-dark me-2 d-none d-sm-inline-flex align-items-center gap-1 badge-live-scroll"><i class="bi bi-arrow-left-right me-1"></i> Live Scroll</span>

                    <!-- Horizontal Navigation Scroll Arrows -->
                    <div class="btn-group btn-group-sm me-2" role="group" id="festScrollNavGroup">
                        <button type="button" class="btn btn-outline-warning" id="festScrollLeftBtn" title="Scroll Left"><i class="bi bi-chevron-left"></i></button>
                        <button type="button" class="btn btn-outline-warning" id="festScrollRightBtn" title="Scroll Right"><i class="bi bi-chevron-right"></i></button>
                    </div>

                    <div class="btn-group btn-group-sm">
                        <button type="button" class="btn btn-outline-warning active" id="viewCardsBtn"><i class="bi bi-grid-fill me-1"></i> Cards</button>
                        <button type="button" class="btn btn-outline-warning" id="viewTableBtn"><i class="bi bi-table me-1"></i> Table</button>
                    </div>
                </div>
                
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <!-- Search Input -->
                    <div class="input-group input-group-sm" style="max-width: 260px;">
                        <span class="input-group-text bg-dark border-secondary border-opacity-50 text-white-50"><i class="bi bi-search"></i></span>
                        <input type="text" id="festSearchInput" class="form-control bg-dark text-white border-secondary border-opacity-50" placeholder="Search event, student, chest...">
                    </div>
                    
                    <!-- Category Filter Buttons -->
                    <div class="btn-group btn-group-sm" role="group" id="festCategoryFilterGroup">
                        <button type="button" class="btn btn-outline-light active" data-filter="all">All</button>
                        <button type="button" class="btn btn-outline-light" data-filter="Super Senior">Super Senior</button>
                        <button type="button" class="btn btn-outline-light" data-filter="Senior">Senior</button>
                        <button type="button" class="btn btn-outline-light" data-filter="Junior">Junior</button>
                        <button type="button" class="btn btn-outline-light" data-filter="Sub-Junior">Sub-Junior</button>
                    </div>
                </div>
            </div>

            <!-- Event Cards Grid Wrapper (Active Default) -->
            <div class="card-body p-4 position-relative" id="festResultsCardsWrapper">
                <button type="button" class="btn btn-dark rounded-circle shadow position-absolute start-0 top-50 translate-middle-y ms-2 fest-scroll-arrow-btn d-none d-md-flex" id="festFloatingLeftBtn" style="z-index: 10;" title="Scroll Left">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <button type="button" class="btn btn-dark rounded-circle shadow position-absolute end-0 top-50 translate-middle-y me-2 fest-scroll-arrow-btn d-none d-md-flex" id="festFloatingRightBtn" style="z-index: 10;" title="Scroll Right">
                    <i class="bi bi-chevron-right"></i>
                </button>

                <div class="fest-horizontal-track" id="festResultsCardsContainer">
                    <div class="col-12 text-center text-white-50 py-5">
                        <div class="spinner-border text-warning" role="status"></div>
                        <p class="mt-2">Loading event cards...</p>
                    </div>
                </div>
            </div>


            <!-- Event Table Wrapper (Optional Toggle) -->
            <div class="card-body p-0" id="festResultsTableWrapper" style="display: none;">
                <div class="table-responsive">
                    <table class="table custom-table align-middle mb-0">
                        <thead>
                            <tr>
                                <th scope="col" class="ps-4" style="width: 25%; color: #000000 !important; background-color: #e2e8f0 !important;">Event & Category</th>
                                <th scope="col" style="width: 25%;"><span class="badge bg-warning text-dark px-2 py-1"><i class="bi bi-trophy-fill me-1"></i>1st Place (Gold)</span></th>
                                <th scope="col" style="width: 25%;"><span class="badge bg-secondary text-white px-2 py-1"><i class="bi bi-award-fill me-1"></i>2nd Place (Silver)</span></th>
                                <th scope="col" style="width: 25%;"><span class="badge bg-danger text-white px-2 py-1"><i class="bi bi-award me-1"></i>3rd Place (Bronze)</span></th>
                            </tr>
                        </thead>
                        <tbody id="festResultsTableBody">
                            <tr>
                                <td colspan="4" class="text-center py-5 text-white-50">Loading event results...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        AOS.init({ duration: 600, once: true });

        const getApiUrl = (endpoint) => endpoint;

        let allFestResults = [];

        async function fetchScoreboardData() {
            try {
                const res = await fetch(getApiUrl('/api/scoreboard'));
                const data = await res.json();
                
                if (!data.success || !data.scoreboard) return;
                const sb = data.scoreboard;

                document.getElementById('festTitleHeader').innerText = sb.festTitle || 'ATSA Arts Fest Scoreboard';
                document.getElementById('festStatusBadge').innerHTML = `<i class="bi bi-trophy-fill me-1 text-warning"></i> ${sb.festStatus || 'LIVE SCOREBOARD'}`;

                // Render Teams Grid
                const teamsContainer = document.getElementById('scoreboardTeamsContainer');
                const teams = sb.teams || [];
                
                if (teams.length === 0) {
                    teamsContainer.innerHTML = '<div class="col-12 text-center text-white-50">No teams registered yet.</div>';
                } else {
                    const maxPoints = Math.max(...teams.map(t => t.points || 0), 1);
                    const rankIcons = ['bi-trophy-fill', 'bi-award-fill', 'bi-award', 'bi-star-fill'];
                    const rankLabels = ['1st', '2nd', '3rd'];
                    const rankBadges = ['bg-warning text-dark', 'bg-secondary text-white', 'bg-danger text-white', 'bg-info text-dark'];

                    let teamsHTML = '';
                    teams.forEach((team, index) => {
                        const rank = index + 1;
                        const rankIcon = rankIcons[index] || 'bi-star-fill';
                        const rankLabel = rankLabels[index] || `#${rank}`;
                        const badgeClass = rankBadges[index] || 'bg-light text-dark';
                        const percent = Math.min(100, Math.round(((team.points || 0) / maxPoints) * 100));

                        teamsHTML += `
                            <div class="col-6 col-md-3" data-aos="zoom-in" data-aos-delay="${index * 100}">
                                <div class="card glass-card team-card h-100 border-0 overflow-hidden position-relative">
                                    <div class="card-header border-0 text-white text-center py-3 position-relative" style="background-color: ${team.color || '#198754'};">
                                        <span class="position-absolute top-0 start-0 m-2 badge ${badgeClass} shadow d-inline-flex align-items-center gap-1"><i class="bi ${rankIcon}"></i> ${rankLabel}</span>
                                        <h3 class="fw-bold mb-0 mt-2 text-white">${team.name}</h3>
                                    </div>
                                    <div class="card-body text-center p-3">
                                        <div class="display-5 fw-bold text-white mb-1">${team.points || 0}</div>
                                        <small class="text-uppercase text-white-50 fw-semibold" style="letter-spacing: 1px;">Points</small>
                                        
                                        <div class="progress mt-3 bg-dark" style="height: 10px;">
                                            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: ${percent}%; background-color: ${team.color || '#198754'};" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    teamsContainer.innerHTML = teamsHTML;
                }

                // Render Results View (Cards + Table)
                allFestResults = sb.results || [];
                renderResultsView();

            } catch (err) {
                console.error('Error fetching scoreboard:', err);
            }
        }

        // --- Horizontal Auto-Moving Ticker & Drag Scroll Handler (Infinite Loop) ---
        function initFestHorizontalScroll(container, leftBtnIds = [], rightBtnIds = [], direction = 'left-to-right') {
            if (!container) return;

            let isHovered = false;
            let isDragging = false;
            let startX = 0;
            let scrollLeftPos = 0;
            const autoScrollSpeed = 2.5; // Fast & smooth horizontal auto-scroll speed for TV stage scoreboard

            // Set initial scroll position to middle set for Left-to-Right loop
            setTimeout(() => {
                const halfWidth = container.scrollWidth / 2;
                if (halfWidth > 0 && container.scrollLeft === 0 && direction === 'left-to-right') {
                    container.scrollLeft = halfWidth;
                }
            }, 50);

            function marqueeLoop() {
                if (!isHovered && !isDragging && container.scrollWidth > container.clientWidth) {
                    const halfWidth = container.scrollWidth / 2;
                    if (halfWidth > 0) {
                        if (direction === 'left-to-right') {
                            // Move cards from Left towards Right
                            container.scrollLeft -= autoScrollSpeed;
                            if (container.scrollLeft <= 1) {
                                container.scrollLeft += halfWidth;
                            }
                        } else {
                            // Move cards from Right towards Left
                            container.scrollLeft += autoScrollSpeed;
                            if (container.scrollLeft >= halfWidth) {
                                container.scrollLeft -= halfWidth;
                            }
                        }
                    }
                }
                container._marqueeAnimId = requestAnimationFrame(marqueeLoop);
            }

            if (container._marqueeAnimId) {
                cancelAnimationFrame(container._marqueeAnimId);
            }
            container._marqueeAnimId = requestAnimationFrame(marqueeLoop);

            if (!container._eventsBound) {
                container._eventsBound = true;

                // Pause auto-moving on mouse hover or touch interaction
                container.addEventListener('mouseenter', () => { isHovered = true; });
                container.addEventListener('mouseleave', () => { isHovered = false; });
                container.addEventListener('touchstart', () => { isHovered = true; }, { passive: true });
                container.addEventListener('touchend', () => {
                    setTimeout(() => { isHovered = false; }, 2500);
                }, { passive: true });

                // Drag-to-scroll functionality for mouse
                container.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    isHovered = true;
                    startX = e.pageX - container.offsetLeft;
                    scrollLeftPos = container.scrollLeft;
                    container.style.cursor = 'grabbing';
                });

                window.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        container.style.cursor = 'grab';
                        setTimeout(() => { isHovered = false; }, 2500);
                    }
                });

                container.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    e.preventDefault();
                    const x = e.pageX - container.offsetLeft;
                    const walk = (x - startX) * 1.5;
                    container.scrollLeft = scrollLeftPos - walk;
                });

                // Attach Left navigation buttons
                leftBtnIds.forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) {
                        btn.onclick = (e) => {
                            e.preventDefault();
                            isHovered = true;
                            container.scrollBy({ left: -360, behavior: 'smooth' });
                            setTimeout(() => { isHovered = false; }, 3000);
                        };
                    }
                });

                // Attach Right navigation buttons
                rightBtnIds.forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) {
                        btn.onclick = (e) => {
                            e.preventDefault();
                            isHovered = true;
                            container.scrollBy({ left: 360, behavior: 'smooth' });
                            setTimeout(() => { isHovered = false; }, 3000);
                        };
                    }
                });
            }
        }

        function matchWinner(w, q) {
            if (!w) return false;
            const list = Array.isArray(w) ? w : [w];
            return list.some(item => 
                (item.name && item.name.toLowerCase().includes(q)) ||
                (item.chestNo && item.chestNo.toLowerCase().includes(q)) ||
                (item.team && item.team.toLowerCase().includes(q))
            );
        }

        function renderSingleWinnerCardRow(rankPlace, w) {
            if (rankPlace === '1st') {
                return `
                    <div class="p-2 rounded-3 bg-warning bg-opacity-10 border border-warning border-opacity-25 d-flex align-items-center justify-content-between mb-1">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-trophy-fill text-warning fs-2 me-1"></i>
                            <div>
                                <div class="d-flex align-items-center gap-1 mb-1">
                                    <span class="badge bg-warning text-dark fw-bold small"><i class="bi bi-trophy-fill me-1"></i>1st</span>
                                    <span class="fw-bold text-white fs-6">${w.name || '-'}</span>
                                </div>
                                <div class="d-flex flex-wrap align-items-center gap-1">
                                    ${w.chestNo ? `<span class="badge bg-dark border border-secondary text-white font-monospace" style="font-size: 0.7rem;">Chest #${w.chestNo}</span>` : ''}
                                    <span class="badge bg-success bg-opacity-75" style="font-size: 0.7rem;">${w.team || '-'}</span>
                                    ${w.grade ? `<span class="badge bg-secondary bg-opacity-50" style="font-size: 0.7rem;">${w.grade}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <span class="badge bg-warning text-dark fw-bold">+${w.points || 0} pts</span>
                    </div>
                `;
            } else if (rankPlace === '2nd') {
                return `
                    <div class="p-2 rounded-3 bg-secondary bg-opacity-10 border border-secondary border-opacity-25 d-flex align-items-center justify-content-between mb-1">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-award-fill text-secondary fs-2 me-1"></i>
                            <div>
                                <div class="d-flex align-items-center gap-1 mb-1">
                                    <span class="badge bg-secondary text-white fw-bold small"><i class="bi bi-award-fill me-1"></i>2nd</span>
                                    <span class="fw-bold text-white fs-6">${w.name || '-'}</span>
                                </div>
                                <div class="d-flex flex-wrap align-items-center gap-1">
                                    ${w.chestNo ? `<span class="badge bg-dark border border-secondary text-white font-monospace" style="font-size: 0.7rem;">Chest #${w.chestNo}</span>` : ''}
                                    <span class="badge bg-danger bg-opacity-75" style="font-size: 0.7rem;">${w.team || '-'}</span>
                                    ${w.grade ? `<span class="badge bg-secondary bg-opacity-50" style="font-size: 0.7rem;">${w.grade}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <span class="badge bg-secondary text-white fw-bold">+${w.points || 0} pts</span>
                    </div>
                `;
            } else {
                return `
                    <div class="p-2 rounded-3 bg-danger bg-opacity-10 border border-danger border-opacity-25 d-flex align-items-center justify-content-between mb-1">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-award text-danger fs-2 me-1"></i>
                            <div>
                                <div class="d-flex align-items-center gap-1 mb-1">
                                    <span class="badge bg-danger text-white fw-bold small"><i class="bi bi-award me-1"></i>3rd</span>
                                    <span class="fw-bold text-white fs-6">${w.name || '-'}</span>
                                </div>
                                <div class="d-flex flex-wrap align-items-center gap-1">
                                    ${w.chestNo ? `<span class="badge bg-dark border border-secondary text-white font-monospace" style="font-size: 0.7rem;">Chest #${w.chestNo}</span>` : ''}
                                    <span class="badge bg-primary bg-opacity-75" style="font-size: 0.7rem;">${w.team || '-'}</span>
                                    ${w.grade ? `<span class="badge bg-secondary bg-opacity-50" style="font-size: 0.7rem;">${w.grade}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <span class="badge bg-danger text-white fw-bold">+${w.points || 0} pts</span>
                    </div>
                `;
            }
        }

        function renderRankCardBlock(rankPlace, winnersData) {
            const list = Array.isArray(winnersData) ? winnersData : (winnersData && winnersData.name ? [winnersData] : []);
            if (list.length === 0) return renderSingleWinnerCardRow(rankPlace, {});
            return list.map(w => renderSingleWinnerCardRow(rankPlace, w)).join('');
        }

        function renderRankTableCell(rankPlace, winnersData) {
            const list = Array.isArray(winnersData) ? winnersData : (winnersData && winnersData.name ? [winnersData] : []);
            if (list.length === 0 || !list[0].name) return '<span class="text-white-50">-</span>';

            const iconClass = rankPlace === '1st' ? 'bi-trophy-fill text-warning' : (rankPlace === '2nd' ? 'bi-award-fill text-secondary' : 'bi-award text-danger');
            const rankBadgeBg = rankPlace === '1st' ? 'bg-warning text-dark' : (rankPlace === '2nd' ? 'bg-secondary text-white' : 'bg-danger text-white');
            const teamBadgeBg = rankPlace === '1st' ? 'bg-success bg-opacity-75' : (rankPlace === '2nd' ? 'bg-danger bg-opacity-75' : 'bg-primary bg-opacity-75');
            const ptsTextClass = rankPlace === '1st' ? 'text-warning' : (rankPlace === '2nd' ? 'text-info' : 'text-danger');

            return list.map(w => `
                <div class="d-flex align-items-center gap-2 mb-1">
                    <i class="bi ${iconClass} fs-4"></i>
                    <div>
                        <div class="d-flex align-items-center gap-1 mb-1">
                            <span class="badge ${rankBadgeBg} fw-bold" style="font-size: 0.7rem;"><i class="bi ${iconClass.split(' ')[0]} me-1"></i>${rankPlace}</span>
                            <span class="fw-bold text-white">${w.name}</span>
                        </div>
                        ${w.chestNo ? `<span class="badge bg-dark text-white me-1">Chest #${w.chestNo}</span>` : ''}
                        <span class="badge ${teamBadgeBg} me-1">${w.team || '-'}</span>
                        ${w.grade ? `<span class="badge bg-secondary bg-opacity-50 me-1">${w.grade}</span>` : ''}
                        <small class="fw-bold ${ptsTextClass}">+${w.points || 0} pts</small>
                    </div>
                </div>
            `).join('');
        }

        function renderResultsView() {
            const cardsContainer = document.getElementById('festResultsCardsContainer');
            const tableBody = document.getElementById('festResultsTableBody');
            const searchInput = document.getElementById('festSearchInput');
            const activeBtn = document.querySelector('#festCategoryFilterGroup .btn.active');
            
            const filterCategory = activeBtn ? activeBtn.getAttribute('data-filter') : 'all';
            const searchQuery = searchInput ? searchInput.value.toLowerCase().trim() : '';

            let filtered = allFestResults || [];

            if (filterCategory !== 'all') {
                filtered = filtered.filter(r => String(r.category).toLowerCase() === filterCategory.toLowerCase());
            }

            if (searchQuery !== '') {
                filtered = filtered.filter(r => 
                    (r.eventName && r.eventName.toLowerCase().includes(searchQuery)) ||
                    matchWinner(r.first, searchQuery) ||
                    matchWinner(r.second, searchQuery) ||
                    matchWinner(r.third, searchQuery)
                );
            }

            // 1. Render Cards View Grid (Active Default)
            if (cardsContainer) {
                if (filtered.length === 0) {
                    cardsContainer.innerHTML = '<div class="w-100 text-center py-5 text-white-50"><i class="bi bi-inbox display-4 d-block mb-3 opacity-50"></i><h5>No event programme results found.</h5><p class="small">Try adjusting search or category filter.</p></div>';
                } else {
                    let singleSet = filtered;
                    if (singleSet.length > 0 && singleSet.length < 4) {
                        let expanded = [];
                        while (expanded.length < 4) {
                            expanded = expanded.concat(filtered);
                        }
                        singleSet = expanded;
                    }

                    // Duplicate singleSet for 360° infinite continuous loop
                    const fullList = singleSet.concat(singleSet);

                    let cardsHTML = '';
                    fullList.forEach(res => {
                        cardsHTML += `
                            <div class="fest-card-item">
                                <div class="card glass-card h-100 border-0 overflow-hidden shadow">
                                    <div class="card-header bg-warning-subtle text-dark p-3 d-flex justify-content-between align-items-center border-bottom border-warning-subtle">
                                        <div>
                                            <h5 class="fw-bold mb-0" style="color: #000000 !important;"><i class="bi bi-award-fill text-warning me-2"></i>${res.eventName}</h5>
                                            <small style="color: #000000 !important; font-weight: 600;"><i class="bi bi-tag me-1"></i>${res.category || 'General'}</small>
                                        </div>
                                        <span class="badge bg-dark text-white fw-bold px-2 py-1 rounded-pill small">Rank List</span>
                                    </div>
                                    <div class="card-body p-3 d-flex flex-column gap-2">
                                        <!-- 1st Rank (Gold) -->
                                        ${renderRankCardBlock('1st', res.first)}
                                        <!-- 2nd Rank (Silver) -->
                                        ${renderRankCardBlock('2nd', res.second)}
                                        <!-- 3rd Rank (Bronze) -->
                                        ${renderRankCardBlock('3rd', res.third)}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    cardsContainer.innerHTML = cardsHTML;
                    initFestHorizontalScroll(cardsContainer, ['festScrollLeftBtn', 'festFloatingLeftBtn'], ['festScrollRightBtn', 'festFloatingRightBtn'], 'left-to-right');
                }
            }

            // 2. Render Table View (Secondary)
            if (tableBody) {
                if (filtered.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-white-50"><i class="bi bi-inbox display-5 d-block mb-2 opacity-50"></i>No published event results matching query.</td></tr>';
                } else {
                    let rowsHTML = '';
                    filtered.forEach(res => {
                        rowsHTML += `
                            <tr>
                                <td class="ps-4">
                                    <span class="fw-bold d-block fs-6" style="color: #000000 !important;">${res.eventName}</span>
                                    <span class="badge rounded-pill small fw-semibold" style="color: #000000 !important; background-color: #fef08a !important;">${res.category || 'General'}</span>
                                </td>
                                <td>
                                    ${renderRankTableCell('1st', res.first)}
                                </td>
                                <td>
                                    ${renderRankTableCell('2nd', res.second)}
                                </td>
                                <td>
                                    ${renderRankTableCell('3rd', res.third)}
                                </td>
                            </tr>
                        `;
                    });
                    tableBody.innerHTML = rowsHTML;
                }
            }
        }

        // Search & Category Event Handlers
        document.getElementById('festSearchInput').addEventListener('input', renderResultsView);

        const filterBtns = document.querySelectorAll('#festCategoryFilterGroup .btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                filterBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderResultsView();
            });
        });

        // View Switcher Handlers
        const viewCardsBtn = document.getElementById('viewCardsBtn');
        const viewTableBtn = document.getElementById('viewTableBtn');
        const cardsWrapper = document.getElementById('festResultsCardsWrapper');
        const tableWrapper = document.getElementById('festResultsTableWrapper');

        if (viewCardsBtn && viewTableBtn && cardsWrapper && tableWrapper) {
            viewCardsBtn.addEventListener('click', () => {
                viewCardsBtn.classList.add('active');
                viewTableBtn.classList.remove('active');
                cardsWrapper.style.display = 'block';
                tableWrapper.style.display = 'none';
            });

            viewTableBtn.addEventListener('click', () => {
                viewTableBtn.classList.add('active');
                viewCardsBtn.classList.remove('active');
                cardsWrapper.style.display = 'none';
                tableWrapper.style.display = 'block';
            });
        }

        // Toggle Native Browser Full Screen
        document.getElementById('browserFullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.error(err));
            } else {
                document.exitFullscreen().catch(err => console.error(err));
            }
        });

        // Initial Load & Auto-Refresh every 5 seconds for live stage LED screen updates
        fetchScoreboardData();
        setInterval(fetchScoreboardData, 5000);
    </script>
</body>
</html>
